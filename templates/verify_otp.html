{% extends "base.html" %}{% block title %}Verify Your Email | Pasig City{% endblock %}{% block content %}<div class="narrow auth-card"><span class="eyebrow">EMAIL VERIFICATION</span><h1>Verify Your Email</h1><p class="muted">Enter the 6-digit code sent to your email. The code expires in 10 minutes.</p><form method="post" class="form"><label for="otp">Verification Code</label><input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" minlength="6" required><button class="btn primary full">Verify OTP</button></form><form method="post" action="{{ url_for('resend_otp') }}" class="form otp-resend"><button class="btn outline full" type="submit" {% if cooldown %}disabled{% endif %}>Resend OTP{% if cooldown %} ({{ cooldown }}s){% endif %}</button></form><p class="form-note"><a href="{{ url_for('register') }}">Return to registration</a> · <a href="{{ url_for('login') }}">Back to Login</a></p></div>{% endblock %}
